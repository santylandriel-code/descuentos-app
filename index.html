<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Descuentos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {--bg:#0b0b0b;--card:#151515;--muted:#a4a4a4;--accent:#8b5cf6;--text:#f2f2f2;--input:#0f0f10;--border:#2a2a2a;}
  *{box-sizing:border-box}
  body {margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:var(--bg);color:var(--text);}
  h1{text-align:center;margin:20px 0;}
  .wrap{max-width:920px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}@media(max-width:760px){.grid{grid-template-columns:1fr;}}
  label{display:block;font-size:.92rem;color:var(--muted)}
  input{width:100%;padding:10px;margin-top:4px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:#fff;font-size:1rem;}
  .btn{padding:10px 14px;border-radius:8px;background:linear-gradient(180deg,var(--accent),#6d28d9);color:#fff;border:none;cursor:pointer;}
  .result{font-weight:700;text-align:right;}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.35);}
  .table{width:100%;border-collapse:collapse;margin-top:8px;}
  .table th,.table td{padding:6px;text-align:right;border-bottom:1px dashed var(--border);}
  .table th:first-child,.table td:first-child{text-align:left;}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Calculadora de Descuentos</h1>
  <div class="card">
    <div class="grid">
      <div>
        <label>Subtotal</label>
        <input id="subtotal" type="text" placeholder="$ 0">
        <label>IVA (%)</label>
        <input id="iva" type="text" value="21%">
        <label>Percepciones (%)</label>
        <input id="percep" type="text" value="0%">
      </div>
      <div>
        <p class="badge">Descuentos secuenciales</p>
        <button class="btn" id="add">＋ Agregar descuento</button>
        <button class="btn" id="calc">Calcular</button>
        <p class="muted" style="margin-top:8px" id="efectivoBadge">Efectivo: 0%</p>
      </div>
    </div>
  </div>
  <div class="card">
    <table class="table" id="tabla">
      <thead><tr><th>#</th><th>%</th><th>Base</th><th>Monto</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><td colspan="3">Total descuentos</td><td id="totalDesc">$ 0,00</td></tr></tfoot>
    </table>
  </div>
  <div class="card">
    <div class="grid">
      <div>
        <p>Subtotal <span class="result" id="outSubtotal">$ 0,00</span></p>
        <p>IVA <span class="result" id="outIva">$ 0,00</span></p>
        <p>Percepciones <span class="result" id="outPercep">$ 0,00</span></p>
        <p>Total bruto <span class="result" id="outBruto">$ 0,00</span></p>
      </div>
      <div>
        <p>Total descuentos <span class="result" id="outDesc">$ 0,00</span></p>
        <p>Total final <span class="result" id="outFinal">$ 0,00</span></p>
      </div>
    </div>
  </div>
</div>

<script>
function parsePct(v){if(typeof v!=='string')v=String(v||'');v=v.trim();var hasPct=/%$/.test(v);v=v.replace(/[^0-9,.-]/g,'');if(v.indexOf(',')>-1&&v.indexOf('.')>-1){v=v.replace(/\./g,'');v=v.replace(',', '.');}else if(v.indexOf(',')>-1){v=v.replace('.', '');v=v.replace(',', '.');}var n=Number(v);if(!isFinite(n))return 0;if(hasPct)return n/100;if(n>1)return n/100;return n;}
function parseMoney(v){if(typeof v!=='string')v=String(v||'');v=v.replace(/[^0-9,.-]/g,'');if(v.indexOf(',')>-1&&v.indexOf('.')>-1){v=v.replace(/\./g,'');v=v.replace(',', '.');}else if(v.indexOf(',')>-1){v=v.replace('.', '');v=v.replace(',', '.');}var n=Number(v);return isFinite(n)?n:0;}
function fmt(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);}

// --- Formato en vivo para el Subtotal (siempre con $ y miles) ---
function formatLiveMoney(input){
  let value = input.value.replace(/[^0-9]/g,'');
  if(value===''){ input.value='$ '; return; }
  let number = parseInt(value,10);
  input.value = '$ ' + new Intl.NumberFormat('es-AR').format(number);
}

// Tabla de descuentos
var tbody=document.querySelector('#tabla tbody');var idx=0;
function addRow(){
  idx++; var tr=document.createElement('tr');
  tr.innerHTML='<td>'+idx+'</td>'
    +'<td><input type="text" class="pct" placeholder="Ingrese % de descuento"></td>'
    +'<td class="base">$ 0,00</td>'
    +'<td class="monto">$ 0,00</td>';
  tbody.appendChild(tr);
}

// Cálculo
function calc(){
  var subtotal=parseMoney(document.getElementById('subtotal').value);
  var iva=parsePct(document.getElementById('iva').value);
  var percep=parsePct(document.getElementById('percep').value);
  var pcts=[].slice.call(document.querySelectorAll('.pct')).map(i=>parsePct(i.value)).filter(p=>p>0);
  document.getElementById('outSubtotal').textContent=fmt(subtotal);

  var base=subtotal,totalDesc=0;
  pcts.forEach(p=>{var d=base*p;totalDesc+=d;base-=d;});

  var ivaMonto=base*iva;
  var percepMonto=base*percep;

  var brutoSinDesc=subtotal+(subtotal*iva)+(subtotal*percep);
  document.getElementById('outBruto').textContent=fmt(brutoSinDesc);

  var final=base+ivaMonto+percepMonto;
  document.getElementById('outIva').textContent=fmt(ivaMonto);
  document.getElementById('outPercep').textContent=fmt(percepMonto);
  document.getElementById('outDesc').textContent=fmt(totalDesc);
  document.getElementById('totalDesc').textContent=fmt(totalDesc);
  document.getElementById('outFinal').textContent=fmt(final);

  var baseDet=subtotal;
  [].slice.call(tbody.children).forEach((tr,i)=>{
    var p=pcts[i]||0; var d=baseDet*p;
    tr.querySelector('.base').textContent=fmt(baseDet);
    tr.querySelector('.monto').textContent=fmt(d);
    baseDet-=d;
  });

  var efectivo=(totalDesc/subtotal)*100;
  document.getElementById('efectivoBadge').textContent='Efectivo: '+(isFinite(efectivo)? efectivo.toFixed(2):'0.00')+'%';
}

// Eventos
document.getElementById('add').onclick=()=>addRow();
document.getElementById('calc').onclick=calc;
document.addEventListener('input',e=>{
  if(e.target.id==='subtotal'){ formatLiveMoney(e.target); }
  if(['subtotal','iva','percep'].includes(e.target.id) || e.target.classList.contains('pct')) calc();
});

// Estado inicial
addRow(); addRow();
const subtotalInput=document.getElementById('subtotal'); subtotalInput.value='$ ';
</script>

<script>
if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
</body>
</html>
